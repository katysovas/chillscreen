<svg viewBox="0 0 2600 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
<!-- ============================================================
     SILENT DISCO - headphone rave under a dark sky
     2600 x 800 | ground line y=660 | SMIL animations
     Stage band: mid x ~810-1790 (SilentDiscoStage renders in front on
     the foreground layer) - keep big props out of that band.
     ============================================================ -->

<defs>
  <linearGradient id="sd-night" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#02030c" stop-opacity="0.96"/>
    <stop offset="55%" stop-color="#060a1c" stop-opacity="0.9"/>
    <stop offset="88%" stop-color="#0a1024" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0a1024" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sd-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a0f20"/>
    <stop offset="100%" stop-color="#05070f"/>
  </linearGradient>
  <linearGradient id="sd-beamfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sd-ball" cx="35%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#f4faff"/>
    <stop offset="55%" stop-color="#9fb6cc"/>
    <stop offset="100%" stop-color="#3c4a5c"/>
  </radialGradient>
  <linearGradient id="sd-fadeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#02030c" stop-opacity="0"/>
    <stop offset="100%" stop-color="#02030c" stop-opacity="1"/>
  </linearGradient>
</defs>

<!-- ===== DARK SKY (deep night over the rave; fades out at the horizon) ===== -->
<rect x="0" y="0" width="2600" height="680" fill="url(#sd-night)"/>

<!-- stars -->
<g fill="#cfe6ff">
  <circle cx="120" cy="60" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="130" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="44" r="1.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="170" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="80" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1240" cy="40" r="1.4"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1480" cy="140" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="1720" cy="60" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="1960" cy="120" r="1.8"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="2200" cy="50" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="2440" cy="150" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
</g>

<!-- ===== OVERHEAD TRUSS RIG (100px lattice, tiles cleanly) ===== -->
<g stroke="#1c2a4a" fill="none">
  <line x1="0" y1="66" x2="2600" y2="66" stroke-width="6"/>
  <line x1="0" y1="112" x2="2600" y2="112" stroke-width="6"/>
  <path stroke-width="3" d="M0,66 L50,112 L100,66 L150,112 L200,66 L250,112 L300,66 L350,112 L400,66 L450,112 L500,66 L550,112 L600,66 L650,112 L700,66 L750,112 L800,66 L850,112 L900,66 L950,112 L1000,66 L1050,112 L1100,66 L1150,112 L1200,66 L1250,112 L1300,66 L1350,112 L1400,66 L1450,112 L1500,66 L1550,112 L1600,66 L1650,112 L1700,66 L1750,112 L1800,66 L1850,112 L1900,66 L1950,112 L2000,66 L2050,112 L2100,66 L2150,112 L2200,66 L2250,112 L2300,66 L2350,112 L2400,66 L2450,112 L2500,66 L2550,112 L2600,66"/>
</g>
<!-- truss LED strip pulsing along the rig -->
<line x1="0" y1="89" x2="2600" y2="89" stroke="#36e3ff" stroke-width="2" stroke-dasharray="14 86" opacity="0.5">
  <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.2s" repeatCount="indefinite"/>
</line>

<!-- ===== HAZE BANDS ===== -->
<rect x="0" y="160" width="2600" height="190" fill="#9fd8ff" opacity="0.05">
  <animate attributeName="opacity" values="0.04;0.1;0.04" dur="8s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="330" width="2600" height="220" fill="#9fd8ff" opacity="0.05">
  <animate attributeName="opacity" values="0.1;0.04;0.1" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- ===== HANGING FIXTURES + VOLUMETRIC BEAM CONES ===== -->
<g>
  <!-- blue, swinging, far left -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 230 126;8 230 126;-8 230 126" dur="9s" repeatCount="indefinite"/>
    <rect x="216" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
    <polygon points="222,142 238,142 360,660 120,660" fill="#3d9bff" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="230" cy="140" r="7" fill="#3d9bff"/>
  </g>
  <!-- amber -->
  <rect x="536" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="542,142 558,142 660,660 440,660" fill="#ff9d3d" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="550" cy="140" r="7" fill="#ff9d3d"/>
  <!-- green -->
  <rect x="836" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="842,142 858,142 950,660 750,660" fill="#3dffb0" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="850" cy="140" r="7" fill="#3dffb0"/>
  <!-- violet + cyan over the stage pocket - read as backlight -->
  <rect x="1136" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="1142,142 1158,142 1230,660 1070,660" fill="#9d5cff" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="3.6s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="1150" cy="140" r="7" fill="#9d5cff"/>
  <rect x="1436" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="1442,142 1458,142 1530,660 1370,660" fill="#36e3ff" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="1450" cy="140" r="7" fill="#36e3ff"/>
  <!-- magenta -->
  <rect x="1736" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="1742,142 1758,142 1850,660 1650,660" fill="#ff3df0" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="1750" cy="140" r="7" fill="#ff3df0"/>
  <!-- amber -->
  <rect x="2036" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
  <polygon points="2042,142 2058,142 2160,660 1940,660" fill="#ff9d3d" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="2050" cy="140" r="7" fill="#ff9d3d"/>
  <!-- blue, swinging, far right -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="8 2370 126;-8 2370 126;8 2370 126" dur="9s" repeatCount="indefinite"/>
    <rect x="2356" y="112" width="28" height="30" rx="4" fill="#0a0f1e"/>
    <polygon points="2362,142 2378,142 2480,660 2240,660" fill="#3d9bff" opacity="0.2">
      <animate attributeName="opacity" values="0.1;0.34;0.1" dur="5s" begin="3.6s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="2370" cy="140" r="7" fill="#3d9bff"/>
  </g>
</g>

<!-- ===== FLOOR LASER FANS sweeping up from the ground ===== -->
<g opacity="0.85">
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-9 420 650;9 420 650;-9 420 650" dur="7s" repeatCount="indefinite"/>
    <polygon fill="#ff3df0" opacity="0.16" points="420,650 240,60 286,60"/>
    <polygon fill="#36e3ff" opacity="0.18" points="420,650 380,60 412,60"/>
    <polygon fill="#3dffb0" opacity="0.15" points="420,650 470,60 504,60"/>
    <polygon fill="#9d5cff" opacity="0.13" points="420,650 580,60 626,60"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="8 2180 650;-8 2180 650;8 2180 650" dur="8.5s" repeatCount="indefinite"/>
    <polygon fill="#36e3ff" opacity="0.16" points="2180,650 2000,60 2046,60"/>
    <polygon fill="#ff9d3d" opacity="0.17" points="2180,650 2140,60 2172,60"/>
    <polygon fill="#ff3df0" opacity="0.15" points="2180,650 2230,60 2264,60"/>
    <polygon fill="#3dffb0" opacity="0.13" points="2180,650 2340,60 2386,60"/>
  </g>
</g>

<!-- ===== GIANT DISCO BALL hanging from the truss (right of stage pocket) ===== -->
<g>
  <line x1="1900" y1="112" x2="1900" y2="240" stroke="#1c2a4a" stroke-width="3"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 1900 112;3 1900 112;-3 1900 112" dur="11s" repeatCount="indefinite"/>
    <circle cx="1900" cy="300" r="62" fill="url(#sd-ball)"/>
    <g stroke="rgba(8,14,28,.5)" stroke-width="1.5">
      <line x1="1838" y1="300" x2="1962" y2="300"/>
      <line x1="1844" y1="272" x2="1956" y2="272"/>
      <line x1="1844" y1="328" x2="1956" y2="328"/>
      <line x1="1862" y1="248" x2="1938" y2="248"/>
      <line x1="1862" y1="352" x2="1938" y2="352"/>
      <line x1="1900" y1="238" x2="1900" y2="362"/>
      <line x1="1868" y1="244" x2="1868" y2="356"/>
      <line x1="1932" y1="244" x2="1932" y2="356"/>
    </g>
    <ellipse cx="1878" cy="278" rx="16" ry="22" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- thrown sparkle dots -->
  <circle cx="1790" cy="260" r="3" fill="#36e3ff"><animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="2010" cy="330" r="3" fill="#ff3df0"><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="1850" cy="392" r="2.6" fill="#3dffb0"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="1968" cy="232" r="2.6" fill="#ff9d3d"><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- ===== LEFT-CENTER: GIANT GLITCH "SILENT DISCO" SIGN ===== -->
<style>
  .sd-glitch{
    font-family: 'Oswald', Impact, 'Arial Black', sans-serif;
    font-weight: 700;
    font-size: 130px;
    letter-spacing: 2px;
    fill: #000;
    animation: sd-glitch-anim 3s linear infinite;
  }
  @keyframes sd-glitch-anim {
    0%  {text-shadow:-6px 4px 0px red;}
    10% {text-shadow:4px -6px 0px green;}
    20% {text-shadow:-9px 4px 0px blue;}
    30% {text-shadow:4px -6px 0px yellow;}
    40% {text-shadow:-8px 4px 0px orange;}
    50% {text-shadow:4px 5px 0px purple;}
    60% {text-shadow:-6px 4px 0px brown;}
    70% {text-shadow:4px 7px 0px pink;}
    80% {text-shadow:-9px -4px 0px lime;}
    90% {text-shadow:4px -6px 0px cyan;}
    100%{text-shadow:-9px 4px 0px teal;}
  }
  @media (prefers-reduced-motion:reduce){
    .sd-glitch{animation:none;text-shadow:-6px 4px 0px #ff3df0;}
  }
</style>
<g transform="translate(590,0) rotate(-3) skewY(5) scale(1,1.04) translate(-590,0)">
  <text class="sd-glitch" x="590" y="330" text-anchor="middle">SILENT</text>
  <text class="sd-glitch" x="590" y="450" text-anchor="middle">DISCO</text>
</g>
<ellipse cx="590" cy="668" rx="200" ry="14" fill="#36e3ff" opacity="0.08"/>

<!-- ===== RAVE CROWD with glowing headphones (left of stage pocket) ===== -->
<g>
  <path d="M950,660 L958,640 Q964,628 970,640 L976,660 Z" fill="#04060f"/>
  <path d="M905,660 L913,644 Q919,632 925,644 L931,660 Z" fill="#04060f"/>
  <circle cx="963" cy="632" r="3" fill="#36e3ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="971" cy="632" r="3" fill="#36e3ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="912" cy="636" r="3" fill="#ff3df0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="636" r="3" fill="#ff3df0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  <!-- waved glowsticks -->
  <line x1="940" y1="638" x2="948" y2="616" stroke="#3dffb0" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-26 942 640;26 942 640;-26 942 640" dur="1.8s" repeatCount="indefinite"/>
  </line>
</g>

<!-- ===== RAVE CROWD (right of stage pocket) ===== -->
<g>
  <path d="M1830,660 L1838,640 Q1844,628 1850,640 L1856,660 Z" fill="#04060f"/>
  <path d="M1878,660 L1886,644 Q1892,632 1898,644 L1904,660 Z" fill="#04060f"/>
  <circle cx="1843" cy="632" r="3" fill="#3dffb0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="1851" cy="632" r="3" fill="#3dffb0"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="1885" cy="636" r="3" fill="#ff9d3d"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="1893" cy="636" r="3" fill="#ff9d3d"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></circle>
  <line x1="1866" y1="638" x2="1874" y2="616" stroke="#ff3df0" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="24 1868 640;-24 1868 640;24 1868 640" dur="1.6s" repeatCount="indefinite"/>
  </line>
</g>

<!-- ===== GLOW-BATON STAND (right edge): bucket of foam sticks ===== -->
<rect x="2440" y="606" width="96" height="54" rx="8" fill="#0a0f1e"/>
<g stroke-linecap="round" stroke-width="11">
  <line x1="2460" y1="612" x2="2446" y2="528" stroke="#ff3df0"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/></line>
  <line x1="2476" y1="610" x2="2474" y2="520" stroke="#3dffb0"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="0.7s" repeatCount="indefinite"/></line>
  <line x1="2492" y1="610" x2="2502" y2="524" stroke="#3d9bff"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></line>
  <line x1="2508" y1="612" x2="2526" y2="534" stroke="#ff9d3d"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></line>
  <line x1="2470" y1="614" x2="2456" y2="548" stroke="#36e3ff"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="1s" repeatCount="indefinite"/></line>
</g>
<ellipse cx="2488" cy="668" rx="90" ry="10" fill="#ff3df0" opacity="0.07"/>

<!-- ===== SCATTERED FLOOR GLOW (dropped batons + confetti) ===== -->
<g stroke-linecap="round" stroke-width="9" opacity="0.85">
  <line x1="980" y1="700" x2="1042" y2="688" stroke="#3dffb0"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></line>
  <line x1="1620" y1="716" x2="1676" y2="730" stroke="#ff3df0"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></line>
  <line x1="510" y1="724" x2="566" y2="714" stroke="#3d9bff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" begin="1s" repeatCount="indefinite"/></line>
  <line x1="1950" y1="706" x2="2008" y2="696" stroke="#ff9d3d"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></line>
  <line x1="2330" y1="722" x2="2388" y2="712" stroke="#36e3ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></line>
</g>
<g opacity="0.5">
  <circle cx="430" cy="740" r="2.4" fill="#36e3ff"/>
  <circle cx="900" cy="728" r="2.2" fill="#ff3df0"/>
  <circle cx="1340" cy="744" r="2.4" fill="#3dffb0"/>
  <circle cx="1800" cy="732" r="2" fill="#3d9bff"/>
  <circle cx="2280" cy="742" r="2.4" fill="#ff9d3d"/>
  <circle cx="660" cy="736" r="2.2" fill="#3dffb0"/>
  <circle cx="2060" cy="738" r="2.2" fill="#9d5cff"/>
</g>
</svg>
